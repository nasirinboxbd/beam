<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="50%" stop-color="#101c30"/>
      <stop offset="100%" stop-color="#080d17"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Subtle glow circles -->
  <circle cx="200" cy="180" r="260" fill="#2563eb" opacity="0.12" filter="url(#glow)"/>
  <circle cx="950" cy="400" r="280" fill="#7c3aed" opacity="0.12" filter="url(#glow)"/>

  <!-- Header Badge -->
  <rect x="80" y="60" width="180" height="34" rx="17" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="170" y="82" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.5">STRUCTURAL CAE</text>

  <!-- Title & Subtitle -->
  <text x="80" y="145" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
    BeamLab <tspan fill="url(#accentGrad)">Pro</tspan>
  </text>
  <text x="80" y="188" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
    Interactive Structural Beam Analysis · SFD, BMD, Deflection &amp; Influence Lines
  </text>

  <!-- Main Showcase Container Card -->
  <rect x="80" y="225" width="1040" height="330" rx="20" fill="#111c2e" stroke="#33445f" stroke-width="1.5" opacity="0.95"/>

  <!-- Beam Line -->
  <line x1="160" y1="310" x2="1040" y2="310" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>

  <!-- Supports -->
  <!-- Support A (Pin) -->
  <polygon points="160,314 135,355 185,355" fill="#2563eb" stroke="#60a5fa" stroke-width="2"/>
  <line x1="125" y1="358" x2="195" y2="358" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="160" cy="318" r="3.5" fill="#ffffff"/>
  <!-- Support B (Roller) -->
  <polygon points="1040,314 1015,352 1065,352" fill="#2563eb" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="1026" cy="360" r="5" fill="#60a5fa"/>
  <circle cx="1054" cy="360" r="5" fill="#60a5fa"/>
  <line x1="1005" y1="368" x2="1075" y2="368" stroke="#60a5fa" stroke-width="2"/>

  <!-- Applied Distributed Load (UDL) -->
  <path d="M 160,305 L 160,250 L 600,250 L 600,305 Z" fill="#fbbf24" opacity="0.2"/>
  <line x1="160" y1="250" x2="600" y2="250" stroke="#fbbf24" stroke-width="3"/>
  <!-- Downward arrows -->
  <g stroke="#fbbf24" stroke-width="2.5" fill="#fbbf24">
    <line x1="200" y1="250" x2="200" y2="300"/><polygon points="200,305 195,294 205,294"/>
    <line x1="300" y1="250" x2="300" y2="300"/><polygon points="300,305 295,294 305,294"/>
    <line x1="400" y1="250" x2="400" y2="300"/><polygon points="400,305 395,294 405,294"/>
    <line x1="500" y1="250" x2="500" y2="300"/><polygon points="500,305 495,294 505,294"/>
    <line x1="600" y1="250" x2="600" y2="300"/><polygon points="600,305 595,294 605,294"/>
  </g>
  <text x="380" y="240" fill="#fbbf24" font-family="system-ui, monospace" font-size="16" font-weight="700" text-anchor="middle">w = 15 kN/m</text>

  <!-- Point Load P -->
  <g stroke="#f43f5e" stroke-width="3" fill="#f43f5e">
    <line x1="820" y1="230" x2="820" y2="300"/>
    <polygon points="820,305 813,290 827,290"/>
  </g>
  <text x="820" y="220" fill="#f43f5e" font-family="system-ui, monospace" font-size="16" font-weight="700" text-anchor="middle">P = 40 kN</text>

  <!-- SFD Curve Mini Preview -->
  <path d="M 160,420 L 160,390 L 600,435 L 600,410 L 820,410 L 820,445 L 1040,445 L 1040,420" fill="none" stroke="#34d399" stroke-width="3"/>
  <text x="160" y="445" fill="#34d399" font-family="system-ui, monospace" font-size="13" font-weight="600">SFD · Shear Force</text>

  <!-- BMD Curve Mini Preview -->
  <path d="M 160,500 Q 380,455 600,470 L 820,465 L 1040,500" fill="none" stroke="#60a5fa" stroke-width="3"/>
  <text x="160" y="525" fill="#60a5fa" font-family="system-ui, monospace" font-size="13" font-weight="600">BMD · Bending Moment</text>

  <!-- Deflection Mini Curve -->
  <path d="M 160,500 Q 600,535 1040,500" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="600" y="525" fill="#c084fc" font-family="system-ui, monospace" font-size="13" font-weight="600" text-anchor="middle">Elastic Deflection δ(x)</text>

  <!-- Feature Pills -->
  <g font-family="system-ui, sans-serif" font-size="13" font-weight="600">
    <!-- Pill 1 -->
    <rect x="730" y="385" width="160" height="34" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="810" y="407" fill="#93c5fd" text-anchor="middle">Euler-Bernoulli FEM</text>

    <!-- Pill 2 -->
    <rect x="910" y="385" width="170" height="34" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="995" y="407" fill="#6ee7b7" text-anchor="middle">Step-by-Step Solns</text>

    <!-- Pill 3 -->
    <rect x="730" y="430" width="160" height="34" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
    <text x="810" y="452" fill="#d8b4fe" text-anchor="middle">Influence Lines ILD</text>

    <!-- Pill 4 -->
    <rect x="910" y="430" width="170" height="34" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="995" y="452" fill="#fde68a" text-anchor="middle">Live Moving Truck</text>
  </g>

  <!-- Footer Tag -->
  <text x="80" y="595" fill="#64748b" font-family="system-ui, sans-serif" font-size="14">
    Developed by Md. Nasir Uddin (BUET Civil Engineering · RAJUK AAO · 46th &amp; 47th BCS)
  </text>
</svg>
